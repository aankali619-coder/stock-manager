<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Manager</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <nav>
    <b>📦 StockManager</b>
    <a href="/" class="on">Dashboard</a>
    <a href="/items-page">Items</a>
    <a href="/movements">Movements</a>
    <a href="/warehouses">Warehouses</a>
    <a href="/alerts">Alerts</a>
    <a href="/reports">Reports</a>
    <a href="/suppliers">Suppliers</a>
    <a href="/purchases">Purchases</a>
    <a href="/sales-page">Sales</a>
    <a href="/users-page">Users</a>
    <span style="margin-left:auto;color:#78787c;font-size:12px;">@ 2026</a>
    <a href="/logout" style="color:#78787c;">Logout</a>
  </nav>
  <main>
    <div id="loginBox" class="card">
      <div class="row">
        <button id="tabLogin" onclick="showTab('login')">Login</button>
        <button id="tabSignup" class="ghost" onclick="showTab('signup')">Sign up</button>
      </div>
      <div id="loginForm">
        <input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
      </div>
      <div id="signupForm" class="hide">
        <input id="su_u" placeholder="Choose username"><input id="su_e" placeholder="Email (optional)"><input id="su_p" type="password" placeholder="Password (min 6)"><button onclick="signup()">Create account</button>
      </div>
      <hr style="border-color:#334155;margin:14px 0">
      <p id="loginErr" style="color:#f87171"></p>
    </div>

    <div id="app" class="hide">
      <div id="features" style="display:none;padding:12px;background:#334155;border-radius:8px;margin-bottom:12px;">
        <h3 style="margin:0;color:#e2e8f0;">Features</h3>
      </div>
      <div class="row" id="stats"></div>
      <div class="card">
        <div class="row">
          <input id="search" placeholder="Search name, SKU, barcode, category..." oninput="loadItems()">
          <select id="locFilter" onchange="loadItems()"><option value="">All locations</option></select>
          <button onclick="toggleLow()" class="ghost" id="lowBtn">Show low stock</button>
        </div>
        <div class="row">
          <button onclick="scan()" class="ghost">📷 Scan barcode</button>
          <button onclick="showForm()">+ Add item</button>
          <button class="ghost" onclick="exportCSV()">⬇ Export CSV</button>
        </div>
        <div id="reader" class="hide"></div>
        <table><thead><tr><th>SKU</th><th>Name</th><th>Price</th><th>Cost</th><th>Qty</th><th>Location</th><th>Expiry</th><th></th></tr></thead>
        <tbody id="items"></tbody></table>
      </div>

      <div class="card"><h3 style="margin-top:0">📊 Stock value by category</h3><canvas id="chart" height="120"></canvas></div>
      <p id="netStatus" style="color:#94a3b8;text-align:center"></p>

      <div class="card hide" id="form">
        <h3 id="formTitle">Add item</h3>
        <input id="f_sku" placeholder="SKU"><input id="f_name" placeholder="Name">
        <input id="f_category" placeholder="Category"><input id="f_barcode" placeholder="Barcode">
        <input id="f_price" type="number" step="0.01" placeholder="Sell price">
        <input id="f_cost" type="number" step="0.01" placeholder="Buy cost">
        <input id="f_qty" type="number" placeholder="Quantity"><input id="f_min" type="number" placeholder="Min stock alert">
        <input id="f_loc" placeholder="Storage location"><input id="f_sup" placeholder="Supplier"><input id="f_batch" placeholder="Batch no"><input id="f_exp" type="date" placeholder="Expiry">
        <div class="row"><button onclick="save()">Save</button><button class="ghost" onclick="hideForm()">Cancel</button></div>
      </div>

      <div class="card hide" id="adjust">
        <h3 id="adjTitle">Adjust stock</h3>
        <select id="a_type"><option value="in">Add stock (in)</option><option value="out">Remove stock (out)</option><option value="adjust">Set exact quantity</option></select>
        <input id="a_qty" type="number" placeholder="Quantity"><input id="a_note" placeholder="Note (optional)"><div class="row"><button onclick="doAdjust()">Apply</button><button class="ghost" onclick="document.getElementById('adjust').classList.add('hide')">Cancel</button></div>
      </div>
    </main>

    <script>
      // Initialize features list
      const features = ['Alerts','Checkout','Charts','Dashboard','Expiry/Batch Tracking','Item Details','Low Stock','M-Pesa Payments','Price History','POS','Reports','Sales','Search','Stock Value','Suppliers','Warehouse','Users'];
      const ft = document.getElementById('features');
      ft.innerHTML = '<h3>Features</h3>' + features.map(f => `<div><input type="checkbox" id="f_${f.toLowerCase()}" disabled/><label for="f_${f.toLowerCase()}">${f}</label></div>`).join('');

      function showTab(t){document.getElementById('loginForm').classList.toggle('hide',t!='login');document.getElementById('signupForm').classList.toggle('hide',t!='signup');document.getElementById('tabLogin').className=t=='login'?'':'ghost';document.getElementById('tabSignup').className=t=='signup'?'':'ghost'}
      async function signup(){const r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:su_u.value,email:su_e.value,password:su_p.value,phone:su_phn.value,pin:su_pin.value,confirm:su_p2.value,mpesa:su_mpesa.value})});const j=await r.json();if(!r.ok){document.getElementById('loginErr').textContent=j.detail;return}document.getElementById('loginErr').textContent='';document.getElementById('suMsg').textContent='Account created! You can log in now.';showTab('login')}
      async function onGoogle(resp){const r=await fetch('/api/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id_token:resp.credential})});const j=await r.json();if(!r.ok){document.getElementById('loginErr').textContent=j.detail;return}const finish=(j)=>{localStorage.setItem('tok',j.token);localStorage.setItem('role',j.role);localStorage.setItem('seen',j.seen_tutorial?'1':'0');window.location.href='/'}finish(j)}
      async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,p.value,pin:pin.value})});if(!r.ok){const j=await r.json();document.getElementById('loginErr').textContent=j.detail;return}const finish=(j)=>{localStorage.setItem('tok',j.token);localStorage.setItem('role',j.role);localStorage.setItem('seen',j.seen_tutorial?'1':'0');window.location.href='/'}finish(await r.json())}
      function logout(){localStorage.clear();window.location.href='/'}

      const api=(p,o={})=>fetch(p,{...o,headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('tok')}}).then(r=>r.status==401?()=>{localStorage.clear();window.location.href='/login'}():r.json());
      async function loadStats(){const s=await api('/api/stats');if(!s)return;document.getElementById('stats').innerHTML=`<div class="stat"><b>${s.items}</b>items</div><div class="stat"><b>${s.units}</b>units</div><div class="stat"><b>KSh ${s.value}</b>value</div><div class="stat" style="color:#4ade80"><b>KSh ${s.profit}</b>profit</div><div class="stat" style="color:#fbbf24"><b>${s.low_stock}</b>low stock</div>`;const c=await api('/api/charts');if(c){const ctx=document.getElementById('chart');if(window._ch)window._ch.destroy();window._ch=new Chart(ctx,{type:'bar',data:{labels:c.by_category.map(x=>x.category||'(none)'),datasets:[{label:'Value ($)',data:c.by_category.map(x=>x.value),backgroundColor:'#3b82f6'}]},options:{plugins:{legend:{labels:{color:'#e2e8f0'}}},scales:{x:{ticks:{color:'#e2e8f0'}},y:{ticks:{color:'#e2e8f0'}}}}})}
      const today=()=>new Date().toISOString().slice(0,10);
      async function loadItems(){const q=document.getElementById('search').value,loc=document.getElementById('locFilter').value;const list=await api(`/api/items?q=${encodeURIComponent(q)}${lowOnly?'&low=true':''}${loc?'&location='+encodeURIComponent(loc):''}`);if(!list)return;document.getElementById('items').innerHTML=list.map(i=>{const expired=i.expiry&&i.expiry<=today();return`<tr class="${i.quantity<=i.min_stock?'low':''}${expired?' exp':''}"><td>${i.sku}</td><td>${i.name}</td><td>KSh ${i.price.toFixed(2)}</td><td>KSh ${(i.cost||0).toFixed(2)}</td><td>${i.quantity}</td><td>${i.location||''}</td><td>${i.expiry||''}${expired?' ⚠️':''}</td><td><button class="ghost" onclick="edit(${i.id})">✏️</button> <button class="ghost" onclick="openAdjust(${i.id},'${i.name}')">±</button> <button class="ghost" onclick="window.open('/label/${i.id}','_blank')">🖨</button>${'admin'===localStorage.getItem('role')?`<button class="danger" onclick="del(${i.id})">🗑</button>`:''}</td></tr>`}).join('')}
      async function loadLocations(){const l=await api('/api/locations');if(!l)return;const f=document.getElementById('locFilter');const existing=[...f.options].map(o=>o.value);l.forEach(x=>{if(!existing.includes(x)){const o=document.createElement('option');o.value=x;f.appendChild(o)}})}

      function toggleLow(){lowOnly=!lowOnly;document.getElementById('lowBtn').textContent=lowOnly?'Show all':'Show low stock';loadItems()}
      function showForm(){document.getElementById('form').classList.remove('hide');['f_sku','f_name','f_category','f_barcode','f_price','f_cost','f_qty','f_min','f_loc','f_sup','f_batch','f_exp'].forEach(id=>document.getElementById(id).value='')}
      function hideForm(){document.getElementById('form').classList.add('hide')}
      function edit(id){const r=await api('/api/items/'+id);const i=r.item;document.getElementById('formTitle').textContent='Edit '+i.name;['sku','name','category','barcode','price','cost','loc','sup','batch','exp'].forEach(k=>document.getElementById('f_'+k).value=i[k=='loc'?'location':k]||'');document.getElementById('f_qty').value=i.quantity;document.getElementById('f_min').value=i.min_stock}
      async function save(){const body={sku:document.getElementById('f_sku').value,name:document.getElementById('f_name').value,category:document.getElementById('f_category').value,barcode:document.getElementById('f_barcode').value,price:parseFloat(document.getElementById('f_price').value)||0,cost:parseFloat(document.getElementById('f_cost').value)||0,quantity:parseInt(document.getElementById('f_qty').value)||0,min_stock:parseInt(document.getElementById('f_min').value)||0,location:document.getElementById('f_loc').value,supplier:document.getElementById('f_sup').value,batch:document.getElementById('f_batch').value,expiry:document.getElementById('f_exp').value};const r=await api(editId?'/api/items/'+editId:'/api/items',{method:editId?'PUT':'POST',body:JSON.stringify(body)});if(r&&r.detail)return alert(r.detail);hideForm();loadItems();loadStats()}
      function del(id){if(!confirm('Delete?'))return;await api('/api/items/'+id,{method:'DELETE'});loadItems();loadStats()}
      function openAdjust(id,name){document.getElementById('adjTitle').textContent='Adjust: '+name;document.getElementById('adjust').classList.remove('hide')}
      async function doAdjust(){const r=await api(`/api/items/${adjId}/adjust`,{method:'POST',body:JSON.stringify({type:a_type.value,qty:+a_qty.value,note:a_note.value})});if(r&&r.detail)return alert(r.detail);document.getElementById('adjust').classList.add('hide');document.getElementById('a_qty').value='';document.getElementById('a_note').value='';loadItems();loadStats()}
      function scan(){document.getElementById('reader').classList.remove('hide');const scanner=new Html5Qrcode('reader');scanner.start({facingMode:'environment'},{fps:10,qrbox:250},async code=>{await scanner.stop();document.getElementById('reader').classList.add('hide');const r=await fetch('/api/barcode/'+encodeURIComponent(code),{headers:{'Authorization':'Bearer '+localStorage.getItem('tok')}});if(r.ok){const i=await r.json();document.getElementById('search').value=i.sku;loadItems()}else alert('Item not found: '+code)}.catch(e=>alert('Camera error'))}
      function exportCSV(){fetch('/api/items/export.csv',{headers:{'Authorization':'Bearer '+localStorage.getItem('tok')}}).then(r=>r.blob()).then(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='items.csv';a.click()})}

      let lowOnly=false;
      let token=localStorage.getItem('tok'), role=localStorage.getItem('role'), lowOnly=false;
      document.getElementById('loginBox').classList.add('hide');document.getElementById('app').classList.remove('hide');
      document.getElementById('lowBtn').classList.remove('hide');
      loadStats();loadItems();loadLocations();
      if(token===null||token===undefined||token==='')window.location.href='/login';
    </script>
</body>
</html>
