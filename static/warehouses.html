<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warehouses</title><link rel="stylesheet" href="/static/app.css"><script src="/static/common.js"></script></head><body>
<main><h1>🏬 Warehouses / Locations</h1><div class="grid" id="g"></div>
<div class="card"><table><thead><tr><th>Location</th><th>Items</th><th>Units</th><th>Stock value</th></tr></thead><tbody id="tb"></tbody></table></div></main>
<script>
async function load(){const r=await api('/api/warehouses');if(!r)return;
g.innerHTML=r.map(w=>`<div class="stat"><b>${w.location}</b>${w.items} items · ${w.units} units<br>$${w.value.toFixed(2)}</div>`).join('');
tb.innerHTML=r.map(w=>`<tr><td>${w.location}</td><td>${w.items}</td><td>${w.units}</td><td>$${w.value.toFixed(2)}</td></tr>`).join('')}
window.addEventListener('DOMContentLoaded',()=>tok()&&load());</script></body></html>
