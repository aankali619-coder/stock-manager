<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alerts</title><link rel="stylesheet" href="/static/app.css"><script src="/static/common.js"></script></head><body>
<main><h1>🚨 Alerts</h1>
<div class="card"><h3>⚠️ Low stock (at or below minimum)</h3><table><thead><tr><th>SKU</th><th>Name</th><th>Qty</th><th>Min</th><th>Location</th></tr></thead><tbody id="low"></tbody></table></div>
<div class="card"><h3>⏰ Expiring within 30 days</h3><table><thead><tr><th>SKU</th><th>Name</th><th>Expiry</th><th>Qty</th></tr></thead><tbody id="exp"></tbody></table></div>
<div class="card"><h3>🚫 Missing / Out of stock (0 units)</h3><table><thead><tr><th>SKU</th><th>Name</th><th>Price</th><th>Location</th></tr></thead><tbody id="miss"></tbody></table></div>
</main><script>
window.addEventListener('DOMContentLoaded',async()=>{if(!tok())return;
const l=await api('/api/items?low=true');low.innerHTML=l&&l.length?l.map(i=>`<tr class="low"><td>${i.sku}</td><td>${i.name}</td><td>${i.quantity}</td><td>${i.min_stock}</td><td>${i.location||''}</td></tr>`).join(''):'<tr><td colspan=5>All good 👍</td></tr>';
const e=await api('/api/expiring?days=30');exp.innerHTML=e&&e.length?e.map(i=>`<tr class="exp"><td>${i.sku}</td><td>${i.name}</td><td>${i.expiry}</td><td>${i.quantity}</td></tr>`).join(''):'<tr><td colspan=4>Nothing expiring soon 👍</td></tr>';
const m=await api('/api/missing');miss.innerHTML=m&&m.length?m.map(i=>`<tr><td>${i.sku}</td><td>${i.name}</td><td>$${i.price.toFixed(2)}</td><td>${i.location||''}</td></tr>`).join(''):'<tr><td colspan=4>All items in stock 👍</td></tr>'});
</script></body></html>
