<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Stock Manager - Login</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/static/app.css">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StockManager">
</head>
<body>
  <nav style="position:fixed;top:0;left:0;height:100%;width:260px;background:#0d0d14;padding:30px 25px;border-right:1px solid #1e1e24">
    <b>📦 StockManager</b>
    <a href="/" class="on">Dashboard</a>
    <a href="/items-page">Items</a>
    <a href="/movements">Movements</a>
    <a href="/warehouses">Warehouses</a>
    <a href="/alerts">Alerts</a>
    <a href="/reports">Reports</a>
    <a href="/suppliers">Suppliers</a>
    <a href="/purchases">Purchases</a>
    <a href="/sales-page">Sales</a>
    <a href="/users-page">Users</a>
    <span style="margin-left:auto;color:#78787c;font-size:12px;">@ 2026</a>
    <a href="/logout" style="color:#78787c;">Logout</a>
  </nav>
  <main style="margin-left:260px;padding:40px 20px;min-height:100vh">
    <div class="card" style="background:#1e293b;border-radius:12px;padding:40px;margin-bottom:40px">
      <h2 style="text-align:center;margin-bottom:30px">📦 StockManager</h2>
      <div class="row">
        <button id="tabLogin" onclick="showTab('login')" style="width:50%;">Login</button>
        <button id="tabSignup" class="ghost" onclick="showTab('signup')" style="width:50%;">Register</button>
      </div>
      <div id="loginForm">
        <input id="u" placeholder="Username" style="width:100%"><input id="p" type="password" placeholder="Password" style="width:100%">
        <button onclick="login()" style="width:100%">Login</button>
      </div>
      <div id="signupForm" class="hide">
        <input id="su_u" placeholder="Choose username" style="width:100%"><input id="su_e" type="email" placeholder="Email" style="width:100%"><input id="su_p" type="password" placeholder="Create password (min 8)" style="width:100%"><input id="su_p2" type="password" placeholder="Confirm password" style="width:100%"><input id="su_phn" type="tel" placeholder="Phone" style="width:100%"><input id="su_pin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN (if set)" style="width:100%"><button onclick="signup()" style="width:100%">Create account</button>
      </div>
      <hr style="border-color:#334155;margin:14px 0">
      <p id="loginErr" style="color:#f87171;margin-bottom:10px"></p>
      <p id="suMsg" style="color:#4ade80;margin-bottom:10px"></p>
    </div>
    <div id="gbtn"></div>
  </main>
  <script>
    function showTab(t){document.getElementById('loginForm').classList.toggle('hide',t!='login');document.getElementById('signupForm').classList.toggle('hide',t!='signup');document.getElementById('tabLogin').className=t=='login'?'':'ghost';document.getElementById('tabSignup').className=t=='signup'?'':'ghost'}
    async function signup(){const r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:su_u.value,email:su_e.value,password:su_p.value,phone:su_phn.value,pin:su_pin.value,confirm:su_p2.value,mpesa:su_mpesa.value})});const j=await r.json();if(!r.ok){document.getElementById('loginErr').textContent=j.detail;return}document.getElementById('suMsg').textContent='Account created! You can log in now.';showTab('login')}
    async function onGoogle(resp){const r=await fetch('/api/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id_token:resp.credential})});const j=await r.json();if(!r.ok){document.getElementById('loginErr').textContent=j.detail;return}const finish=(j)=>{localStorage.setItem('tok',j.token);localStorage.setItem('role',j.role);localStorage.setItem('seen',j.seen_tutorial?'1':'0');window.location.href='/'}finish(j)}
    async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,p.value,pin:pin.value})});if(!r.ok){const j=await r.json();document.getElementById('loginErr').textContent=j.detail;return}const finish=(j)=>{localStorage.setItem('tok',j.token);localStorage.setItem('role',j.role);localStorage.setItem('seen',j.seen_tutorial?'1':'0');window.location.href='/'}finish(await r.json())}
    fetch('/api/config').then(r=>r.json()).then(c=>{if(!c.google_client_id)return;let tries=0;const iv=setInterval(()=>{tries++;if(window.google){clearInterval(iv);google.accounts.id.initialize({client_id:c.google_client_id,callback:onGoogle});google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'outline',size:'large'})}if(tries>20){clearInterval(iv);gbtn.innerHTML='<p style="color:#f87171">Google sign-in failed</p>'}},500)})
  </script>
</body>
</html>
