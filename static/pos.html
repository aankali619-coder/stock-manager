<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout</title><link rel="stylesheet" href="/static/app.css"><script src="/static/common.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script></head><body>
<main><h1>🛒 Checkout — Scan to Sell</h1>
<div class="card">
<div class="row"><input id="bc" placeholder="Scan barcode or type SKU..."><button onclick="addScan()">Add</button><button class="ghost" onclick="startScan()">📷 Camera</button>
<select id="itemSel" onchange="if(this.value)lookup(this.value);this.value=''"><option value="">— or pick an item from the shop list —</option></select></div>
<div id="reader" class="hide" style="max-width:320px"></div>
<div id="lastScan" style="margin-top:8px;font-weight:bold;color:#4ade80"></div>
<div id="payInfo" class="hide" style="border:1px solid #4ade80;border-radius:8px;padding:10px;margin-top:8px"></div>
</div>
<div class="card"><h3>🧾 Current bill</h3>
<table><thead><tr><th>Item</th><th>Supplier</th><th>Qty</th><th>Cost</th><th>Unit price (+5%)</th><th>Line total</th><th></th></tr></thead><tbody id="cart"></tbody></table>
<p><b>Total: KSh <span id="total">0.00</span></b> — Your profit (5%): KSh <span id="profit">0.00</span></p>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="markup" checked onchange="render()"> Auto +5% on supplier cost</label>
<div class="row">
<input id="cust" placeholder="Customer name"><input id="mpesa" placeholder="Customer M-Pesa number">
<button onclick="pay()">💰 Charge & sell</button>
<button class="danger" onclick="cart=[];render()">🗑 Clear bill</button></div>
</div></main>
<script>
let cart=[];
const $=(i)=>document.getElementById(i);
async function lookup(code){const r=await fetch('/api/barcode/'+encodeURIComponent(code),{headers:{'Authorization':'Bearer '+tok()}});if(!r.ok)return alert('Item not found: '+code);const i=await r.json();
 if(cart.find(c=>c.id==i.id)){cart.find(c=>c.id==i.id).qty++}else{cart.push({id:i.id,name:i.name,price:i.price,cost:i.cost||0,supplier:i.supplier||'',stock:i.quantity,qty:1})}
 $('lastScan').textContent='✅ '+i.name+' — KSh '+i.price.toFixed(2)+' ('+i.quantity+' in stock)';
 $('bc').value='';render()}
async function addScan(){const v=$('bc').value.trim();if(v)lookup(v)}
async function startScan(){$('reader').classList.remove('hide');const s=new Html5Qrcode('reader');try{await s.start({facingMode:'environment'},{fps:10,qrbox:250},async code=>{await s.stop();$('reader').classList.add('hide');lookup(code)})}catch(e){alert('Camera error')}}
function unitPrice(c){return $('markup').checked&&c.cost>0?c.cost*1.05:c.price}
async function fillSel(){const r=await api('/api/items');if(!r)return;const sel=$('itemSel');sel.innerHTML='<option value="">— or pick an item from the shop list —</option>'+r.map(i=>`<option value="${i.sku}">${i.name} — ${i.barcode||i.sku} — KSh ${i.price} (${i.quantity} left)</option>`).join('')}
window.addEventListener('DOMContentLoaded',()=>tok()&&fillSel());
function render(){const t=cart.reduce((s,c)=>s+unitPrice(c)*c.qty,0);const cost=cart.reduce((s,c)=>s+(c.cost||0)*c.qty,0);
$('cart').innerHTML=cart.map((c,i)=>`<tr><td>${c.name} <small style="color:#94a3b8">(${c.stock} left)</small></td><td>${c.supplier||'-'}</td>
<td><input type="number" min="1" value="${c.qty}" style="width:70px" onchange="cart[${i}].qty=+this.value;render()"></td>
<td>KSh ${(c.cost||0).toFixed(2)}</td><td>KSh ${unitPrice(c).toFixed(2)}</td><td>KSh ${(unitPrice(c)*c.qty).toFixed(2)}</td>
<td><button class=danger onclick="cart.splice(${i},1);render()">✕ remove</button></td></tr>`).join('')||'<tr><td colspan=7>Scan an item to start the bill</td></tr>';
$('total').textContent=t.toFixed(2);$('profit').textContent=(t-cost).toFixed(2)}
async function pay(){if(!cart.length)return alert('Bill is empty');
const r=await api('/api/sales',{method:'POST',body:JSON.stringify({customer:cust.value,items:cart.map(c=>({item_id:c.id,qty:c.qty,price:unitPrice(c)})),mpesa:mpesa.value})});
if(r&&r.detail)return alert(r.detail);
const box=$('payInfo');box.classList.remove('hide');
box.innerHTML=`<b>💳 Payment prompt sent to customer</b><br>Customer: ${cust.value||'-'}<br>M-Pesa: ${mpesa.value||'-'}<br>Amount: KSh ${r.total}<br>${r.stk?r.stk.message:''}<br><small style="color:#94a3b8">Customer should enter their M-Pesa PIN on their phone to complete.</small>`;
cart=[];render();cust.value='';mpesa.value=''}
$('bc').addEventListener('keydown',e=>{if(e.key=='Enter')addScan()});
</script></body></html>
